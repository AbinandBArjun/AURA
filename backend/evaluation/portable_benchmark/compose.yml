services:
  postgres:
    image: postgres:16.16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37
    environment:
      POSTGRES_DB: aura_portable_benchmark
      POSTGRES_USER: aura_benchmark
      POSTGRES_PASSWORD: ${AURA_BENCHMARK_POSTGRES_PASSWORD:?Set a unique benchmark password}
      PGDATA: /var/lib/postgresql/data/pgdata
    labels:
      org.aura.portable-benchmark: "1"
      org.aura.portable-execution: "${AURA_BENCHMARK_EXECUTION_ID:?Use the benchmark lifecycle command}"
    ports:
      - "127.0.0.1:${AURA_BENCHMARK_POSTGRES_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_benchmark -d aura_portable_benchmark -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    environment:
      QDRANT__SERVICE__API_KEY: ${AURA_BENCHMARK_QDRANT_KEY:?Set a unique benchmark API key}
    labels:
      org.aura.portable-benchmark: "1"
      org.aura.portable-execution: "${AURA_BENCHMARK_EXECUTION_ID:?Use the benchmark lifecycle command}"
    ports:
      - "127.0.0.1:${AURA_BENCHMARK_QDRANT_PORT:-16333}:6333"
    tmpfs:
      - /qdrant/storage

networks:
  default:
    external: true
    name: "${AURA_BENCHMARK_NETWORK:?Use the benchmark lifecycle command}"
