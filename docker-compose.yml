services:
  postgres:
    image: postgres:16
    container_name: aura-postgres
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: abinandb7
    ports:
      - "5433:5432"
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aura-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - aura_qdrant_data:/qdrant/storage

volumes:
  aura_postgres_data:
  aura_qdrant_data:
